[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphostate-lab"
version = "0.1.0"
description = "Patient-held-out experiments for conditional molecular-state prediction from histology"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<4", "torch>=2.2,<3", "PyYAML>=6,<7", "h5py>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]
images = ["Pillow>=10", "torchvision>=0.17", "timm>=1.0", "pyarrow>=15"]

[project.scripts]
morphostate = "morphostate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

